name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nunca dois deploys ao mesmo tempo; um push novo espera o anterior terminar.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Mesma versão da VM.
          node-version: '20.20.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rodar deploy.sh na VM
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # A chave só consegue rodar deploy.sh (command= no authorized_keys);
          # o comando enviado aqui é ignorado pela VM.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "ubuntu@$DEPLOY_HOST" deploy
      - name: Apagar a chave do runner
        if: always()
        run: rm -f ~/.ssh/deploy
